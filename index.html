<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculetor</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="container">
        <div class="calculetor">

        <div class="display">

    <div>
            <h style="color: aqua;">Simple Calculetor</h><br>
    <input style="background-color: blanchedalmond;" placeholder="i love you yene">
    </div>
 <div class="button" style="display: grid; grid-template-columns: repeat(4,0.5fr);">
<button class="btn" data-action="clear" >Clr</button>
<button class="btn" data-action="delete">Del</button>
<button class="btn" data-action="Equal">=</button>
<button class="btn" data-action="point">.</button>

 

<button class="btn" data-number="1" >1</button>
<button class="btn" data-number="2">2</button>
<button class="btn" data-number="3">3</button>
<button class="btn" data-opration="addition">+</button>

<button class="btn" data-number="4" >4</button>
<button class="btn" data-number="5">5</button>
<button class="btn" data-number="6">6</button>
<button class="btn" data-opration="minus">-</button>



<button class="btn" data-number="7" >7</button>
<button class="btn" data-number="8">8</button>
<button class="btn" data-number="9">9</button>
<button class="btn" data-opration="x">x</button>

<button class="btn" data-number="#">#</button>
<button class="btn" data-number="0">0</button>
<button class="btn" data-number="*">*</button>
<button class="btn" data-opration="/">/</button>

 </div>
        </div>
    
     </div>
 <script src="script.js"></script>
</body>
</html>
